[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vex-video"
version = "0.1.0"
description = "Local procedural video studio for Windows"
requires-python = ">=3.11,<3.14"
dependencies = ["PySide6-Essentials>=6.8,<7", "pydantic>=2.10,<3", "imageio-ffmpeg>=0.6,<1"]

[project.optional-dependencies]
audio = ["kokoro-onnx>=0.4,<1", "soundfile>=0.13,<1", "faster-whisper>=1.1,<2", "av>=14,<17"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pyinstaller>=6.12,<7"]

[project.scripts]
vex = "vex.main:main"

[tool.setuptools.package-data]
vex = ["ui/*.qml"]

[tool.setuptools.packages.find]
include = ["vex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
